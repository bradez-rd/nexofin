version: '3.8'

services:
  # Base de datos relacional PostgreSQL 16
  postgres:
    image: postgres:16-alpine
    container_name: nexofin-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: nexofin_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./app/db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./app/db/seeds.sql:/docker-entrypoint-initdb.d/02_seeds.sql:ro
      - ./app/db/seed_demo.sql:/docker-entrypoint-initdb.d/03_seed_demo.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nexofin_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Servidor Backend API REST
  api:
    build:
      context: ./app
      dockerfile: Dockerfile
    container_name: nexofin-api
    restart: always
    environment:
      PORT: 3000
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/nexofin_db
      DB_SSL: false
      USE_MEMORY_DB_FALLBACK: false
      JWT_SECRET: nexofin_docker_super_secret_jwt_key_2026
      JWT_EXPIRES_IN: 7d
      DEFAULT_CURRENCY: DOP
      TIMEZONE: America/Santo_Domingo
      CORS_ORIGIN: "*"
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
